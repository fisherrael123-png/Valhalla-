contract:
  name: admin_operation_contract
  version: 0.5.11
  purpose: |
    Switch the system state.
dispatch:
  required: true
  fallback: clarify
  on_ambiguous: clarify
  operations:
    admin_enter:
      triggers:
      - enter admin state
      - enter administrative mode
      - start administrative mode
      - enter administrator mode
    admin_exit:
      triggers:
      - exit admin state
      - exit administrative mode
      - stop administrative mode
      - exit administrator mode
      - enter general state
      - enter base state
operations:
  admin_enter:
    input:
      required: []
      optional: []
    permissions:
      read: true
      write: true
    risk:
      level: medium
      confirmation_required: false
    state_constraints:
      os_status:
        allowed:
        - base
        on_denied: "Denied admin_enter: this operation may run only in base state."
    preconditions: []
    access: {}
    executor:
      type: workflow
      paths:
      - workflows/admin_enter.md
      load_after_validation: true
    output:
      required: []
  admin_exit:
    input:
      required: []
      optional: []
    permissions:
      read: true
      write: true
    risk:
      level: medium
      confirmation_required: false
    state_constraints:
      os_status:
        allowed:
        - admin
        on_denied: "Denied admin_exit: this operation may run only in admin state."
    preconditions: []
    access: {}
    executor:
      type: workflow
      paths:
      - workflows/admin_exit.md
      load_after_validation: true
    output:
      required: []



