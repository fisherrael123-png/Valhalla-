contract:
  name: exit_kb_contract
  version: 0.5.11
  purpose: |
    Exit the active knowledge base under the current Valhalla root.
operations:
  exit_kb:
    input:
      required: []
      optional:
      - kb_name
      pattern:
        canonical: exit knowledge base <kb_name>
        examples:
        - exit knowledge base
        - exit KB
        - exit the current knowledge base
        - exit KB test-kb
    permissions:
      read: true
      write: true
    risk:
      level: medium
      confirmation_required: false
    state_constraints:
      os_status:
        allowed:
        - base
        on_denied: "Denied exit_kb: this operation may run only in base state."
      kb_status:
        allowed:
        - kb:<name>
        on_denied: "Denied exit_kb: this operation requires an active knowledge base."
    preconditions:
    - id: current_root_known
      type: builtin
      parameters: {}
      on_failed: "Precondition not met: current_root_known"
    access: {}
    executor:
      type: workflow
      paths:
      - workflows/kb/exit_kb.md
      load_after_validation: true
    output:
      required:
      - modified_files
      - target_kb
      - current_state



