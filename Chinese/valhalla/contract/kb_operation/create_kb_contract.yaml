contract:
  name: create_kb_contract
  version: 0.5.11
  purpose: |
    在当前valhalla root下创建一个新的知识库。
operations:
  create_kb:
    input:
      required:
      - kb名称
      optional: []
      pattern:
        canonical: 创建kb <kb名称>
        examples:
        - 创建知识库-测试库
        - 创建知识库，名称为测试库
        - 创建kb 测试库
    permissions:
      read: true
      write: true
    risk:
      level: high
      confirmation_required: true
    state_constraints:
      os_status:
        allowed:
        - base
        on_denied: 拒绝执行 create_kb：该操作只能在 base 状态下运行。
      kb_status:
        allowed:
        - idle
        on_denied: 拒绝执行 create_kb：该操作只能在 idle 状态下运行。
    preconditions:
    - id: current_root_known
      type: builtin
      parameters: {}
      on_failed: 前置条件未满足：current_root_known
    - id: target_kb_known
      type: builtin
      parameters: {}
      on_failed: 前置条件未满足：target_kb_known
    - id: target_wiki_absent_or_safe_to_complete
      type: builtin
      parameters: {}
      on_failed: 前置条件未满足：target_wiki_absent_or_safe_to_complete
    access: {}
    executor:
      type: workflow
      paths:
      - workflows/kb/create_kb.md
      load_after_validation: true
    output:
      required:
      - modified_files
      - resource_table_pairs
      - target_kb
      - current_state
      - updated_logs_or_indexes



