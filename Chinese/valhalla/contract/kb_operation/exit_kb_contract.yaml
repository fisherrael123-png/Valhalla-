contract:
  name: exit_kb_contract
  version: 0.5.11
  purpose: |
    在当前valhalla root下退出当前知识库。
operations:
  exit_kb:
    input:
      required: []
      optional:
      - kb名称
      pattern:
        canonical: 退出kb <kb名称>
        examples:
        - 退出知识库
        - 退出kb
        - 退出当前知识库
        - 退出kb 测试库
    permissions:
      read: true
      write: true
    risk:
      level: medium
      confirmation_required: false
    state_constraints:
      os_status:
        allowed:
        - base
        on_denied: 拒绝执行 exit_kb：该操作只能在 base 状态下运行。
      kb_status:
        allowed:
        - kb:<name>
        on_denied: 拒绝执行 exit_kb：该操作只能在某个知识库被激活的状态下运行。
    preconditions:
    - id: current_root_known
      type: builtin
      parameters: {}
      on_failed: 前置条件未满足：current_root_known
    access: {}
    executor:
      type: workflow
      paths:
      - workflows/kb/exit_kb.md
      load_after_validation: true
    output:
      required:
      - modified_files
      - target_kb
      - current_state



